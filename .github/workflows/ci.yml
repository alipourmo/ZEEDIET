name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Pint, PHPStan and Pest
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, zip, pdo_sqlite, sqlite3, openssl, tokenizer, xml, ctype, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: PHPStan (level 6)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

      - name: Pest
        run: |
          mkdir -p build
          set +e
          vendor/bin/pest --log-junit build/pest-junit.xml > build/pest-output.txt 2>&1
          status=$?
          cat build/pest-output.txt
          exit $status

      - name: Report Pest failures as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          if os.path.exists('build/pest-junit.xml'):
              tree = ET.parse('build/pest-junit.xml')
              for case in tree.iter('testcase'):
                  for child in list(case):
                      if child.tag in ('failure', 'error'):
                          message = (child.get('message') or '').replace('\n', ' ')[:800]
                          print(f"::error title={case.get('name')}::{message}")
          if os.path.exists('build/pest-output.txt'):
              lines = open('build/pest-output.txt', encoding='utf8', errors='replace').read().splitlines()
              tail = '%0A'.join(lines[-60:])
              print(f"::error title=Pest output tail::{tail}")
          PY
