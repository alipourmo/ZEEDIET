name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Pint, PHPStan and Pest
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, zip, pdo_sqlite, sqlite3, openssl, tokenizer, xml, ctype, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: PHPStan (level 6)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

      - name: Pest
        run: |
          mkdir -p build
          vendor/bin/pest > build/pest-output.txt 2>&1
          status=$?
          cat build/pest-output.txt
          exit $status

      - name: Report Pest output on failure
        if: failure()
        run: |
          tail -c 9000 build/pest-output.txt > build/tail.txt
          split -b 1300 -d -a 2 build/tail.txt build/chunk_
          for f in build/chunk_*; do
            echo "::notice title=$(basename "$f")::$(base64 -w0 "$f")"
          done
